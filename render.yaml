services:
  - type: web
    name: homeunity
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd .. && npm install --omit=dev
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_DRIVER
        value: auto
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
