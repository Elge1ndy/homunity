name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/public/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          echo "{\"jdkPath\":\"${JAVA_HOME}\"}" > "$HOME/.bubblewrap/config.json"

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias homunity \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass homunity2026 \
            -keypass homunity2026 \
            -dname "CN=Homunity, O=Homunity"

      - name: Init TWA project
        run: |
          yes | bubblewrap init \
            --manifest=https://thermoscopical-ungenerous-agustin.ngrok-free.dev/manifest.webmanifest \
            --directory=android-project \
            --skipPwaValidation

      - name: Attach signing key
        run: |
          node -e "const fs=require('fs');const p='android-project/twa-manifest.json';const m=JSON.parse(fs.readFileSync(p));m.signingKey={path:'../android.keystore',alias:'homunity'};fs.writeFileSync(p,JSON.stringify(m,null,2));"

      - name: Build APK
        working-directory: android-project
        run: bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: homunity2026
          BUBBLEWRAP_KEY_PASSWORD: homunity2026

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: homunity-apk
          path: android-project/app-release-signed.apk
          retention-days: 30